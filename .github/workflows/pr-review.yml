name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request?.number || context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            
            // Get the diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              mediaType: {
                format: 'diff'
              }
            });
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            
            // Save outputs
            core.setOutput('pr_number', pr_number);
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_body', pr.body || '');
            core.setOutput('pr_diff', diff);
            core.setOutput('changed_files', JSON.stringify(files.map(f => f.filename)));
            
            return pr_number;
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic requests
      
      - name: Run Claude Review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-details.outputs.pr_title }}
          PR_BODY: ${{ steps.pr-details.outputs.pr_body }}
          PR_DIFF: ${{ steps.pr-details.outputs.pr_diff }}
          CHANGED_FILES: ${{ steps.pr-details.outputs.changed_files }}
        run: |
          cat << 'EOF' > review.py
          import os
          import json
          import sys
          from anthropic import Anthropic
          
          # Initialize Claude client
          client = Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
          
          # Get PR details from environment
          pr_number = os.environ['PR_NUMBER']
          pr_title = os.environ['PR_TITLE']
          pr_body = os.environ['PR_BODY']
          pr_diff = os.environ['PR_DIFF']
          changed_files = json.loads(os.environ['CHANGED_FILES'])
          
          # Truncate diff if too long (Claude has context limits)
          max_diff_length = 50000
          if len(pr_diff) > max_diff_length:
              pr_diff = pr_diff[:max_diff_length] + "\n... (diff truncated)"
          
          # Create the review prompt
          prompt = f"""당신은 전문 코드 리뷰어입니다. 이 Pull Request를 검토하고 건설적인 피드백을 제공해주세요.
          
          PR 제목: {pr_title}
          PR 설명: {pr_body}
          변경된 파일: {', '.join(changed_files)}
          
          변경 사항:
          ```diff
          {pr_diff}
          ```
          
          다음 항목들을 포함하여 종합적인 리뷰를 제공해주세요:
          1. 코드 품질: 코드 스타일 문제, 안티패턴, 개선 사항이 있나요?
          2. 로직과 정확성: 버그나 논리적 오류가 있나요?
          3. 성능: 성능 관련 우려사항이 있나요?
          4. 보안: 보안 취약점이 있나요?
          5. 베스트 프랙티스: 언어/프레임워크의 베스트 프랙티스를 따르고 있나요?
          6. 문서화: 변경사항이 잘 문서화되어 있나요?
          
          GitHub PR 리뷰 댓글 형식으로 응답해주세요:
          - 상단에 요약
          - 카테고리별로 구체적인 피드백 정리
          - 개선 제안 포함
          - 마크다운 포맷 사용
          - 이모지를 적절히 사용하여 가독성 향상
          
          건설적이고 도움이 되는 피드백을 제공해주세요. 코드가 잘 작성되었다면 그것도 언급해주세요!
          모든 응답은 한국어로 작성해주세요."""
          
          try:
              # Call Claude API
              response = client.messages.create(
                  model="claude-3-5-sonnet-20241022",
                  max_tokens=4000,
                  temperature=0,
                  messages=[
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              )
              
              review_content = response.content[0].text
              
              # Save review to file for GitHub Actions to use
              with open('review.md', 'w') as f:
                  f.write(review_content)
              
              print("Review generated successfully!")
              
          except Exception as e:
              print(f"Error generating review: {str(e)}", file=sys.stderr)
              sys.exit(1)
          EOF
          
          python review.py
      
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review.md', 'utf8');
            
            const pr_number = ${{ steps.pr-details.outputs.pr_number }};
            
            // Post the review as a comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `## 🤖 Claude AI 리뷰\n\n${reviewContent}\n\n---\n*이 리뷰는 Claude 3.5 Sonnet에 의해 자동으로 생성되었습니다. 새로운 리뷰를 요청하려면 \`/review\` 댓글을 작성하세요.*`
            });
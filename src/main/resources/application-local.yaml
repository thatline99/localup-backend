spring:
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/localup?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: root
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
logging:
  level:
    mongodb-command: DEBUG
    thatline:
      localup:
        common:
          aspect:
            MongoDbCommandCountAspect: DEBUG

token:
  access-token:
    name: accessToken
    expiration-seconds: 86400

tour-api:
  # 한국관광공사_국문 관광정보 서비스_GW
  # link: https://www.data.go.kr/data/15101578/openapi.do
  kor-service2:
    service-key: ${KOR_SERVICE2_KEY}

  # 한국관광공사_관광지별 연관 관광지 정보
  # link: https://www.data.go.kr/data/15128560/openapi.do
  tar-rlte-tar-service:
    service-key: ${TAR_RLTE_TAR_SERVICE_KEY}

  # 한국관광공사_기초지자체 중심 관광지 정보
  # link: https://www.data.go.kr/data/15128559/openapi.do
  locgo-hub-tar-service:
    service-key: ${LOCGO_HUB_TAR_SERVICE_KEY}

  # 한국관광공사_관광지 집중률 방문자 추이 예측 정보
  tats-cnctr-rate-service:
    service-key: ${TATS_CNCTR_RATE_SERVICE_KEY}
  data-lab-service:
    service-key: ${DATA_LAB_SERVICE}

storage:
  base-path: ./uploads

etc-api:
  # 기상청 (Korea Meteorological Administration)
  kma:
    vilage-fcst-info-service:
      service-key: ${VILAGE_FCST_INFO_SERVICE_KEY}

# OpenAI ChatGPT API 설정
openai:
  api-key: ${OPENAI_API_KEY}                           # OpenAI API 키 (환경변수로 관리)
  api-url: https://api.openai.com/v1/chat/completions  # ChatGPT API 엔드포인트
  model: gpt-4o-mini                                   # 사용할 GPT 모델 (gpt-4o-mini, gpt-4, gpt-3.5-turbo 등)
  temperature: 0.7                                     # 응답 창의성 수준 (0.0~2.0, 낮을수록 일관성 높음)
  max-tokens: 1000                                     # 응답 최대 토큰 수 (응답 길이 제한)
  max-context-tokens: 3000                             # 컨텍스트 최대 토큰 수 (대화 기록 제한)
